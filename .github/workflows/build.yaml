# Builds, publishes and releases the image. Triggered by a merge to main, which is what a renovate bump is.
name: build

on:
  push:
    branches: [main]
    paths: # everything that can change what gets built; docs and config cannot
      - versions.env
      - Dockerfile
      - lib/**
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the inputs match the newest release
        default: false
        type: boolean
      dryRun:
        description: Build and validate only, publish nothing
        default: false
        type: boolean

# Never in parallel: the build revision is derived from the published releases, so two runs would pick the
# same N. Queue instead of cancelling, so a push during a build is not silently dropped.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write # create the release
  packages: write # push to GHCR
  id-token: write # provenance attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: decide whether to build
        id: guard
        run: bash lib/should_build.sh
        env:
          FORCE: ${{ inputs.force }}

      - name: set up qemu
        # `RUN apk add` executes inside the target arch, so the non-native half needs emulation.
        if: steps.guard.outputs.build == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: set up buildx
        if: steps.guard.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: build
        if: steps.guard.outputs.build == 'true' && inputs.dryRun
        run: make build

      - name: publish to GHCR
        id: publish
        if: steps.guard.outputs.build == 'true' && !inputs.dryRun
        run: make publish # writes RELEASE_TAG / IMAGE_DIGEST / IMAGE_REF to $GITHUB_OUTPUT

      - name: attest the image
        if: steps.publish.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.IMAGE_DIGEST }}
          push-to-registry: true

      # Last on purpose: the release is what makes a build revision real. A run that dies before here leaves
      # an image tag no release announced, and the next run reuses and overwrites that revision.
      - name: create the release
        if: steps.publish.outcome == 'success'
        run: make release
